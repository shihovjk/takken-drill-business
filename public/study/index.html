<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宅建過去問ドリル for Business</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --navy: #1E3A8A;
  --primary: #2563EB;
  --primary-soft: #EAF1FF;
  --accent: #F59E0B;
  --accent-soft: #FFF4DB;
  --red: #DC2626;
  --red-soft: #FDECEC;
  --pencil: #64748B;
  --paper: #F8FAFC;
  --bg: #F5F8FF;
  --surface: #FFFFFF;
  --text: #1E293B;
  --muted: #64748B;
  --line: #DFE6F2;
  --card-quiet: #EEF2F8;
  --shadow: 0 1px 2px rgba(30, 58, 138, .06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --navy: #C7D7FE;
    --primary: #60A5FA;
    --primary-soft: #172A4D;
    --accent: #FBBF24;
    --accent-soft: #3A2E12;
    --red: #F87171;
    --red-soft: #3A1A1D;
    --pencil: #94A3B8;
    --paper: #1B2740;
    --bg: #0B1426;
    --surface: #131F38;
    --text: #E5EAF3;
    --muted: #94A3B8;
    --line: #25365A;
    --card-quiet: #18243F;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Noto Sans JP", system-ui, sans-serif; font-size: 16px; line-height: 1.8;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--primary); }

header {
  background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 10;
}
/* ログイン／アカウント（ヘッダー右端） */
.account-btn {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--primary); background: var(--primary); color: #fff; font-size: 13px; font-weight: 700;
}
.account-btn svg { width: 16px; height: 16px; }
.account-btn.in { background: var(--surface); color: var(--navy); border-color: var(--line); font-weight: 500; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .account-btn:not(.in) { color: #0B1426; } }
@media (max-width: 767px) {
  .account-btn { min-height: 30px; padding: 0 10px; font-size: 12px; }
  header .header-inner { gap: 8px; }
  header .brand { flex-wrap: nowrap; gap: 8px; }
  header .logo { font-size: 16px; white-space: nowrap; }
  header .exam-count { gap: 4px; font-size: 11px; }
  header .exam-count .ec-left b { font-size: 16px; }
  .account-btn.in span { display: none; }
  .account-btn.in { padding: 0 8px; }
}
.header-inner {
  max-width: 1080px; margin: 0 auto; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.logo { font-weight: 700; color: var(--navy); font-size: 18px; background: none; border: 0; padding: 0; letter-spacing: .02em; }
.logo span { color: var(--primary); }
nav { display: flex; gap: 4px; }
nav button {
  position: relative; background: none; border: 0; padding: 6px 12px; border-radius: 8px; color: var(--muted); font-size: 14px;
  display: inline-flex; align-items: center; gap: 6px;
}
nav button svg { width: 18px; height: 18px; }
nav button.active { color: var(--primary); background: var(--primary-soft); font-weight: 500; }
.nav-badge {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff;
  font-size: 11px; line-height: 18px; font-weight: 700; text-align: center;
}
.nav-badge:empty { display: none; }

/* スマホ：タブを画面下に固定（親指で押しやすい位置） */
@media (max-width: 767px) {
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 4px 8px calc(4px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
  }
  nav button {
    flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 0; min-height: 52px; border-radius: 10px;
  }
  nav button svg { width: 24px; height: 24px; }
  nav button.active { background: none; }
  .nav-badge { position: absolute; top: 2px; left: calc(50% + 6px); }
  body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
  header { position: static; }
  .exam-count .ec-label { display: none; }
}
.layout {
  max-width: 1080px; margin: 0 auto; padding: 20px 16px 40px;
  display: grid; grid-template-columns: 1fr; gap: 24px;
}
@media (min-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr) 280px; }
}
main { min-width: 0; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 20px; box-shadow: var(--shadow);
}
h1, h2 { color: var(--navy); line-height: 1.4; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 0 0 12px; }
.lead { color: var(--muted); margin: 0 0 20px; font-size: 14px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 500;
}
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-primary { color: #0F172A; } }
.btn:disabled { opacity: .45; cursor: default; }
.btn-block { width: 100%; }

/* ===== スマホ専用：解いている間は問題だけの集中画面 ===== */
@media (max-width: 767px) {
  body.in-drill header, body.in-drill nav, body.in-drill aside, body.in-drill footer, body.in-drill .columns, body.in-drill .sponsor-wrap { display: none; }
  body.in-drill { padding-bottom: 0; background: var(--surface); }
  /* 下に固定した次へボタン（高さ約77px）と解説のあいだに、しっかり余白をとる */
  body.in-drill .layout { padding: 0 16px calc(136px + env(safe-area-inset-bottom)); gap: 0; }
  body.in-drill .drill-head {
    position: sticky; top: 0; z-index: 5; background: var(--surface);
    margin: 0 -16px; padding: calc(10px + env(safe-area-inset-top)) 16px 0;
  }
  body.in-drill .quiz-top { margin-bottom: 8px; }
  body.in-drill .quiz-title { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  body.in-drill .progress { margin: 0 -16px 8px; border-radius: 0; height: 3px; }
  body.in-drill .card { border: 0; box-shadow: none; padding: 8px 0; background: transparent; }
  body.in-drill .stem { font-size: 16px; }
  body.in-drill .swipe-card { box-shadow: 0 6px 20px rgba(30, 58, 138, .10); min-height: 180px; display: flex; align-items: center; }
  /* 親指が届く画面下に、答えるボタンと次へボタンを固定 */
  body.in-drill .actions, body.in-drill .ox-buttons {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; margin: 0;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--surface); border-top: 1px solid var(--line);
  }
  body.in-drill .actions .btn { flex: 1; min-height: 52px; font-size: 16px; }
  body.in-drill .actions #prev { flex: 0 0 auto; }
  body.in-drill .ox-buttons button { min-height: 64px; }
  body.in-drill .answered .ox-buttons { display: none; }
}

/* ドリル（トップ） */
.brand { display: flex; align-items: baseline; gap: 12px; min-width: 0; flex-wrap: wrap; }
.exam-count { font-size: 12px; color: var(--muted); display: inline-flex; gap: 8px; align-items: baseline; white-space: nowrap; }
.exam-count .ec-left { color: var(--navy); font-weight: 500; }
.exam-count .ec-left b { font-size: 18px; color: var(--primary); margin: 0 2px; font-variant-numeric: tabular-nums; }

.hero {
  color: #fff; border-radius: 16px; padding: 20px; margin-bottom: 20px;
  background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 70%, #3B82F6 100%);
  box-shadow: 0 8px 24px rgba(37, 99, 235, .25);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hero { background: linear-gradient(135deg, #172554 0%, #1D4ED8 100%); box-shadow: none; } }
.hero .cheer { margin: 0 0 16px; font-size: 17px; font-weight: 700; line-height: 1.5; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.hero-top .save-pill { margin-top: 0; }
.hero .phase-chip { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: #1E293B; margin-right: 6px; vertical-align: 2px; }
.hero-stats { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; }
.ring-wrap { position: relative; width: 104px; height: 104px; flex: 0 0 auto; }
.ring { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring-bg { stroke: rgba(255, 255, 255, .22); }
.ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }
.ring-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.ring-num b { font-size: 30px; font-variant-numeric: tabular-nums; }
.ring-num small { font-size: 11px; opacity: .85; }
.hero-side { min-width: 0; }
.streak-big { display: flex; align-items: baseline; gap: 4px; margin-bottom: 10px; }
.streak-big svg { width: 22px; height: 22px; color: var(--accent); align-self: center; }
.streak-big b { font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.streak-big span { font-size: 13px; opacity: .9; }
.week { display: flex; gap: 6px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; opacity: .8; }
.wd i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid rgba(255, 255, 255, .5); }
.wd.done i { background: var(--accent); border-color: var(--accent); }
.wd.today { opacity: 1; font-weight: 700; }
.hero-cta {
  width: 100%; min-height: 52px; border: 0; border-radius: 12px; background: #fff; color: #1E3A8A;
  font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.hero-cta small { font-size: 12px; font-weight: 500; color: var(--muted); }
.hero-cta:active { transform: translateY(1px); }

/* 記録の保存状態：連続日数の下に小さなバッジで置く */
.save-pill {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; padding: 3px 10px; border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .12); color: #fff; font-size: 11px; line-height: 1.6; white-space: nowrap;
}
button.save-pill { text-decoration: underline; text-underline-offset: 2px; }
.save-pill svg { width: 13px; height: 13px; flex: 0 0 auto; }
/* 白いカードの上に置くとき */
.save-pill.light { margin-top: 0; border-color: var(--line); background: var(--primary-soft); color: var(--primary); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.card-head h2 { margin: 0; }
.save-link { background: none; border: 0; padding: 0; color: #fff; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; font-size: 12px; }

/* 出題形式：丸いタブ（選んだ方がグレーの地＋青文字） */
.mode-tabs {
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 5px; margin-bottom: 20px;
  background: var(--surface); border-radius: 999px; box-shadow: 0 2px 12px rgba(15, 23, 42, .08);
}
.mode-tabs button { border: 0; background: none; border-radius: 999px; min-height: 52px; font-size: 15px; font-weight: 700; color: var(--text); transition: background .15s, color .15s; display: grid; place-content: center; line-height: 1.3; }
.mode-tabs button small { font-size: 10px; font-weight: 400; color: var(--muted); }
.mode-tabs button[aria-checked="true"] { background: var(--card-quiet); color: var(--primary); }
.mode-tabs button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* 論点のチェックリスト */
.back-link { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
.check-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
/* 科目は画面幅に合わせて2〜3列で並べる。開いた科目は1行ぶち抜きで項目を出す */
.group-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.topic-list { list-style: none; margin: 0; padding: 0 0 4px 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0 12px; }
.group { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-width: 0; }
.group.open { grid-column: 1 / -1; border-color: var(--primary); }
.group-row { display: flex; align-items: center; }
.group-row .check { flex: 1; min-width: 0; padding-left: 10px; }
.group .check { font-size: 13px; gap: 8px; min-height: 40px; }
.group .check-text { line-height: 1.35; padding: 6px 0; word-break: keep-all; overflow-wrap: anywhere; }
.group .check-text small { display: block; font-size: 10px; color: var(--muted); }
.group .check-count { font-size: 11px; white-space: nowrap; }
.group .box { width: 16px; height: 16px; border-width: 1.5px; border-radius: 4px; }
.expand { flex: 0 0 32px; width: 32px; height: 40px; border: 0; background: none; color: var(--muted); font-size: 12px; border-radius: 8px; transition: transform .2s; }
.group.open .expand { transform: rotate(180deg); color: var(--primary); }
.check.small { min-height: 34px; font-size: 12px; }
.check.small .box { width: 14px; height: 14px; }
.group .check input:checked + .box::after { width: 4px; height: 8px; border-width: 0 1.5px 1.5px 0; }
.check.small input:checked + .box::after { width: 3px; height: 7px; }
.check .box.mixed { background: var(--primary); border-color: var(--primary); }
.check .box.mixed::after { content: ""; width: 8px; height: 2px; background: #fff; border-radius: 1px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; cursor: pointer; }
.check input { position: absolute; opacity: 0; pointer-events: none; }
.check .box { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--muted); flex: 0 0 auto; display: grid; place-items: center; }
.check input:checked + .box { background: var(--primary); border-color: var(--primary); }
.check input:checked + .box::after { content: ""; width: 5px; height: 10px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.check input:focus-visible + .box { outline: 2px solid var(--primary); outline-offset: 2px; }
.check-text { flex: 1; }
.check-count { font-size: 12px; color: var(--muted); }
.check.disabled { cursor: default; color: var(--muted); }
.check.disabled .box { border-color: var(--line); }

.cat-list { display: grid; gap: 8px; }
.cat-card {
  display: flex; align-items: center; gap: 12px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 72px;
}
.cat-card:hover { border-color: var(--primary); }
.cat-icon { flex: 0 0 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: var(--primary-soft); color: var(--primary); }
.cat-icon svg { width: 22px; height: 22px; }
.cat-body { flex: 1; min-width: 0; display: grid; gap: 2px; }
.cat-body b { color: var(--navy); }
.cat-meta { font-size: 12px; color: var(--muted); }
.cat-bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.cat-bar i { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
.cat-go { font-size: 18px; color: var(--muted); transition: transform .2s; }
.cat-item.open .cat-card { border-color: var(--primary); border-bottom-left-radius: 0; border-bottom-right-radius: 0; }
.cat-item.open .cat-go { transform: rotate(180deg); color: var(--primary); }
.picker { background: var(--surface); border: 1px solid var(--primary); border-top: 0; border-radius: 0 0 12px 12px; padding: 4px 14px 14px; }
.picker .btn { margin-top: 10px; }


.section-title { font-size: 14px; color: var(--muted); margin: 0 0 8px; font-weight: 500; }

/* 出題 */
.quiz-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; font-size: 14px; color: var(--muted); }
.quiz-top .right { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
.quiz-top .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.back-btn { flex: 0 0 auto; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; }
/* 解答スピードのタイマー（会員）：小さく、落ち着いた色で */
.q-timer { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 4px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; cursor: pointer; }
.q-timer svg { width: 15px; height: 15px; flex: 0 0 auto; }
.q-timer.off { color: var(--muted); opacity: .55; border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; }
.q-timer.off svg { opacity: .8; }
.q-timer.locked { position: relative; }
.q-timer.locked::after { content: ""; position: absolute; right: 2px; top: 1px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.q-timer i { position: relative; width: 36px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.q-timer b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; background: #93B4F5; transition: width 1s linear; }
.q-timer.over { color: #B45309; }
.q-timer.over b { background: var(--accent); }
@media (max-width: 767px) { .q-timer i { width: 28px; } }
.resume-card { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; border: 1px solid var(--primary); border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; background: var(--surface); }
.resume-card .k { font-size: 12px; color: var(--muted); }
.login-btns { display: grid; gap: 10px; margin: 16px 0; }
.btn-google { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; font-weight: 700; }
.btn-google svg { width: 20px; height: 20px; flex: 0 0 auto; }
.btn-google { background: #fff; color: #1F1F1F; border: 1px solid #DADCE0; }
.btn-google:hover { background: #F8F9FA; }
/* マイページの会員プラン */
.mc-plan { margin: 0 0 4px; font-size: 14px; color: var(--muted); }
.mc-plan b { font-size: 16px; color: var(--navy); margin-right: 8px; }
.mc-status { margin: 0 0 8px; font-size: 14px; }
.mc-refund { margin: 0 0 8px; padding: 8px 12px; border-radius: 10px; background: var(--primary-soft); font-size: 12px; line-height: 1.6; }
.btn-danger { color: var(--red); border-color: var(--red); background: var(--surface); }
.btn-danger:hover { background: var(--red-soft); }
.member-card { margin: 0 0 16px; }
.mc-cancel { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.mc-cancel h3 { margin: 0 0 4px; font-size: 14px; }
.mc-cancel p { margin: 0 0 10px; font-size: 13px; color: var(--muted); line-height: 1.6; }
.cancel-list { margin: 4px 0 8px; padding-left: 20px; font-size: 14px; line-height: 1.8; }
.link-btn { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 14px; padding: 8px; }
.progress { height: 4px; background: var(--line); border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--primary); transition: width .2s; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--card-quiet); color: var(--muted); margin-right: 6px; }
.stem { margin: 10px 0 16px; font-weight: 500; }
/* 過去問の出典のタグ（令和7年度 問1 など） */
.tag.src { background: var(--primary-soft); color: var(--primary); }
/* 「いくつあるか」の問題：ア〜エの記述は押せない。選択肢（一つ〜四つ）はその下に並べる */
.choices.statements .stmt { cursor: default; }
.choices.statements { margin-bottom: 10px; }
.choices.options { grid-template-columns: repeat(4, 1fr); gap: 8px; }
.choices.options .choice { justify-content: center; }
@media (max-width: 480px) { .choices.options { grid-template-columns: repeat(2, 1fr); } }
.rev-note { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; border-left: 4px solid var(--accent); background: var(--accent-soft); font-size: 13px; line-height: 1.6; }
.rev-note b { display: block; margin-bottom: 2px; }
.q-note { margin: 0 0 12px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 13px; line-height: 1.6; }
/* スライダー列の見出し。小さく添えるだけ */
.memo-cap { width: 26px; white-space: nowrap; overflow: visible; text-align: center; font-size: 10px; color: var(--pencil); margin: 0 0 2px; letter-spacing: .1em; }
.choices { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 8px; }
.choice-row { display: flex; align-items: stretch; gap: 6px; }
/* 消去法メモ：選択肢の左に ○ と × を縦に並べた小さなマス。鉛筆書きの灰色で、答えのボタンと区別する */
.memo { flex: 0 0 26px; align-self: flex-start; display: grid; gap: 3px; margin-top: 4px; }
.memo .mk {
  position: relative; width: 26px; height: 22px; padding: 0; border-radius: 6px;
  border: 1px dashed var(--line); background: var(--paper);
  font-family: "Klee One", "Noto Sans JP", cursive; font-size: 13px; line-height: 1; color: var(--pencil); opacity: .55;
}
/* 見た目は小さくても、押せる範囲は広めにとる */
.memo .mk::before { content: ""; position: absolute; inset: -4px -8px; }
.memo .mk.on { opacity: 1; border-style: solid; border-color: var(--pencil); background: var(--surface); font-size: 15px; font-weight: 600; }
.choice {
  flex: 1; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 10px; padding: 10px 14px; display: flex; gap: 10px; line-height: 1.7; min-height: 44px;
}
.choice .num { font-weight: 700; color: var(--navy); flex: 0 0 auto; }
.choice.selected { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
.choice.is-correct { border-color: var(--primary); background: var(--primary-soft); }
.choice.is-wrong { border-color: var(--red); background: var(--red-soft); }

.ox-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
.ox-buttons button {
  min-height: 72px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
  font-size: 32px; font-weight: 700;
}
.ox-buttons .o { color: var(--primary); }
.ox-buttons .x { color: var(--red); }
.ox-buttons button.picked { box-shadow: inset 0 0 0 2px currentColor; }
.ox-statement { border-left: 3px solid var(--navy); padding: 4px 0 4px 14px; margin: 0; font-weight: 500; }
.swipe-card {
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px;
  margin-bottom: 8px; touch-action: pan-y; user-select: none; transition: transform .25s ease; cursor: grab;
}
.swipe-card.dragging { transition: none; cursor: grabbing; }
.swipe-hint { position: absolute; top: 8px; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; pointer-events: none; }
.swipe-hint.o { right: 10px; background: var(--primary-soft); color: var(--primary); opacity: var(--o, 0); }
.swipe-hint.x { left: 10px; background: var(--red-soft); color: var(--red); opacity: var(--x, 0); }
.swipe-card.done { cursor: default; }
.swipe-card.done.ok { border-color: var(--primary); }
.swipe-card.done.ng { border-color: var(--red); }
.swipe-help { font-size: 12px; color: var(--muted); text-align: center; margin: 0 0 12px; }
.ox-context { font-size: 13px; color: var(--muted); margin: 8px 0; }

/* 結果：左に正解・不正解、右に「正解は ②」「正解は ○ 正しい」を大きく。
   ○×は「正しい・誤り」の意味で使うので、正解・不正解には記号を付けない */
.result { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; border-radius: 10px; padding: 10px 16px; margin-bottom: 16px; font-weight: 700; }
.result .verdict { font-size: 18px; }
.result .answer { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
.ans-badge { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; font-size: 20px; line-height: 1; color: var(--primary); background: var(--surface); border: 2px solid currentColor; font-variant-numeric: tabular-nums; }
.ans-badge.x { color: var(--red); }
.result.ok { background: var(--primary-soft); color: var(--primary); }
.result.ng { background: var(--red-soft); color: var(--red); }
/* 解答のすぐ下の広告（細い横長）。読み込む前から高さを取っておき、解説が後からずれないようにする */
.ad-answer { margin: 0 0 16px; text-align: center; line-height: 1; }
.ad-answer .ad-label { display: block; margin-bottom: 4px; font-size: 10px; letter-spacing: .08em; color: var(--muted); }
.ad-answer ins, .ad-answer .ad-dummy { display: inline-block; width: 320px; height: 50px; }
@media (min-width: 560px) { .ad-answer ins, .ad-answer .ad-dummy { width: 468px; height: 60px; } }
@media (max-width: 359px) { .ad-answer { margin-left: -16px; margin-right: -16px; } }
.ad-answer .ad-dummy { display: inline-grid; place-content: center; border: 1px dashed var(--line); border-radius: 6px; background: var(--card-quiet); color: var(--muted); font-size: 12px; }
.ad-answer:has(ins[data-ad-status="unfilled"]) { display: none; }
.ad-answer.aff { line-height: 1.5; font-size: 13px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card-quiet); }
.ad-answer.aff .aa-note { color: var(--muted); margin-right: 8px; }
.ad-answer.aff a { font-weight: 700; color: var(--primary); white-space: nowrap; }
.ad-answer.aff a::after { content: " ›"; white-space: pre; }
.exp-list { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 10px; }
.exp-list li { border-top: 1px solid var(--line); padding-top: 10px; font-size: 15px; }
.exp-head { font-weight: 700; }
.exp-head .t { color: var(--primary); }
.exp-head .f { color: var(--red); }
.law { font-size: 12px; color: var(--muted); }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
/* 戻るボタンは、次へボタンと同じ高さの左端に置く */
.actions #prev { margin-right: auto; }
.prev-row { margin-top: 12px; }
/* 解説のすぐ後の次へボタンは、解説と離して置く */
.law + .actions, .detail + .actions, .exp-list + .actions { margin-top: 24px; }
.page-link { margin: 12px 0 0; font-size: 13px; }
.page-link a { color: var(--primary); }
.source-note { font-size: 12px; color: var(--muted); margin-top: 12px; overflow-wrap: anywhere; }

/* スケジュール */
/* 残り日数のカードは、試験が近づくほど 青 → 紫 → オレンジ → 赤 と色が変わる */
.countdown {
  --cd1: #1E3A8A; --cd2: #2563EB; --cd3: #3B82F6; --cd-shadow: rgba(37, 99, 235, .25);
  color: #fff; border-radius: 14px; padding: 12px 16px;
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  background: linear-gradient(135deg, var(--cd1) 0%, var(--cd2) 60%, var(--cd3) 100%);
  box-shadow: 0 8px 24px var(--cd-shadow);
}
.cd-purple { --cd1: #4C1D95; --cd2: #6D28D9; --cd3: #8B5CF6; --cd-shadow: rgba(109, 40, 217, .25); }
.cd-orange { --cd1: #C2410C; --cd2: #EA580C; --cd3: #F59E0B; --cd-shadow: rgba(234, 88, 12, .25); }
.cd-red { --cd1: #B91C1C; --cd2: #DC2626; --cd3: #EF4444; --cd-shadow: rgba(220, 38, 38, .25); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .countdown { box-shadow: none; } }
/* ヘッダーの「あと◯日」の数字も同じ色の段階にする */
.exam-count .ec-left b.cd-blue { color: var(--primary); }
.exam-count .ec-left b.cd-purple { color: #7C3AED; }
.exam-count .ec-left b.cd-orange { color: #EA580C; }
.exam-count .ec-left b.cd-red { color: #DC2626; }
.countdown .cd-date { font-size: 12px; line-height: 1.35; white-space: nowrap; opacity: .9; }
.countdown .days { font-size: 14px; font-weight: 700; line-height: 1.1; margin-top: 2px; white-space: nowrap; }
.countdown .days b { font-size: 40px; margin: 0 2px; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
/* 見出しの横に試験年の切り替え、その下に「段階のステップ表示」と「残り日数」を横並び */
.sched-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.sched-head h1 { margin: 0; }
.sched-top { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 16px; }
.sched-top .card { margin: 0; padding: 14px 16px 12px; }
/* 道のりのバー：教材ごとの色の区間を繋げ、終わった割合だけ塗る。色はスライダーと同じ --c（.pc-◯◯） */
.roadmap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.rm-seg { display: grid; gap: 6px; min-width: 0; }
.rm-bar { height: 12px; border-radius: 6px; background: var(--card-quiet); overflow: hidden; }
.rm-bar i { display: block; height: 100%; background: var(--c, var(--primary)); border-radius: 6px; }
.rm-lbl { display: grid; justify-items: center; font-size: 12px; font-weight: 700; color: var(--c, var(--primary)); line-height: 1.35; white-space: nowrap; }
.rm-lbl em { font-style: normal; font-size: 10px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.rm-now { margin-top: 2px; font-size: 10px; color: #fff; background: var(--red); border-radius: 999px; padding: 0 6px; }
/* スマホでは横に並べると窮屈なので、残り日数を横長の帯にして上に置き、段階表示は全幅にする */
@media (max-width: 560px) {
  .sched-top { grid-template-columns: 1fr; gap: 8px; }
  .sched-top .countdown { order: -1; flex-direction: row; justify-content: space-between; padding: 8px 16px; }
  .countdown .cd-date br { display: none; }
  .countdown .cd-date { font-size: 13px; }
  .countdown .days b { font-size: 32px; }
  .sched-top .card { padding: 12px 12px 10px; }
}
.year-pick { display: inline-flex; background: var(--card-quiet); border-radius: 999px; padding: 2px; }
.year-pick button { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 4px 12px; border-radius: 999px; min-height: 32px; }
.year-pick button.on { background: var(--surface); color: var(--navy); font-weight: 700; box-shadow: var(--shadow); }

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .now-marker em { color: var(--accent); } }

.member-badge { display: inline-block; font-size: 11px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); margin-left: 6px; vertical-align: 2px; }
.locked { position: relative; }
.locked .blur { filter: blur(3px); opacity: .6; pointer-events: none; user-select: none; }

/* あなたの学習段階 */
/* 学習の進み具合：1行ずつのスライダー。左に項目名（とおすすめ）、右に今の値 */
.progress-sliders { display: grid; gap: 4px; margin-bottom: 18px; }
.ps-row { display: grid; grid-template-columns: 5.2em 1fr 4.2em; align-items: center; gap: 10px; min-height: 40px; }
/* スマホでは項目名と値の列を詰めて、バーを長くする */
@media (max-width: 560px) { .ps-row { grid-template-columns: 3.6em 1fr 3.7em; gap: 6px; } }
.ps-label { display: grid; font-size: 12px; font-weight: 700; color: var(--navy); line-height: 1.3; }
.ps-label .pg-rec { justify-self: start; }
.ps-val { font-size: 13px; font-weight: 700; color: var(--c); text-align: right; white-space: nowrap; }
/* 項目ごとの色：--c＝濃い色、--c2＝薄い色 */
.ps-row { --c: var(--primary); --c2: #93C5FD; --c-shadow: rgba(37, 99, 235, .35); }
.pc-drill { --c: #16A34A; --c2: #86EFAC; --c-shadow: rgba(22, 163, 74, .35); }
.pc-past { --c: #EA580C; --c2: #FDBA74; --c-shadow: rgba(234, 88, 12, .35); }
.pc-mock { --c: #7C3AED; --c2: #C4B5FD; --c-shadow: rgba(124, 58, 237, .35); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pc-text { --c: #60A5FA; --c2: #1D4ED8; }
  :root:not([data-theme="light"]) .pc-drill { --c: #4ADE80; --c2: #15803D; }
  :root:not([data-theme="light"]) .pc-past { --c: #FB923C; --c2: #C2410C; }
  :root:not([data-theme="light"]) .pc-mock { --c: #A78BFA; --c2: #6D28D9; }
}
/* 区切りつきスライダー：段階の数−1個のブロックを並べ、すき間を区切りにする。
   つまみの中心とすき間がそろうよう、つまみの半径（12px）ぶん内側に並べる */
.ps-track { position: relative; height: 28px; --r: 12px; }
.ps-segs { position: absolute; top: 50%; left: var(--r); right: var(--r); height: 10px; margin-top: -5px; display: flex; gap: 4px; }
.ps-segs b { flex: 1; border-radius: 5px; background: var(--line); transition: background .15s; }
.ps-segs b.on { background: linear-gradient(90deg, var(--c2), var(--c)); }
.ps-track input[type=range] { -webkit-appearance: none; appearance: none; position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; background: transparent; z-index: 2; cursor: pointer; }
.ps-track input[type=range]::-webkit-slider-runnable-track { background: transparent; height: 100%; }
.ps-track input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 24px; height: 24px; margin-top: 2px; border-radius: 50%;
  background: radial-gradient(circle, var(--c) 0 4px, var(--surface) 5px); border: 2px solid var(--c);
  box-shadow: 0 2px 6px var(--c-shadow);
}
.ps-track input[type=range]::-moz-range-track { background: transparent; }
.ps-track input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: radial-gradient(circle, var(--c) 0 4px, var(--surface) 5px); border: 2px solid var(--c); box-shadow: 0 2px 6px var(--c-shadow); }
.ps-track input[type=range]:focus-visible { outline: none; }
.ps-track:focus-within .ps-segs b { box-shadow: 0 0 0 2px var(--primary-soft); }

.pg-rec { border: 0; background: none; padding: 0; font-size: 11px; font-weight: 500; color: var(--primary); white-space: nowrap; }
.sheet-head-right { display: inline-flex; align-items: center; gap: 8px; }


/* 段階の表示：ステップ表示。点線の輪＝時期として本来いる段階 */
.stepper { position: relative; display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); margin: 4px 0 14px; }
.stepper::before, .stepper::after { content: ""; position: absolute; top: 11px; left: 12.5%; height: 3px; border-radius: 2px; }
.stepper::before { right: 12.5%; background: var(--line); }
.stepper::after { width: calc(75% * var(--done) / 100); background: var(--primary); }
.stepper > span { position: relative; z-index: 1; display: grid; justify-items: center; gap: 6px; background: none; border: 0; padding: 0; min-height: 52px; }
.stepper .dot { width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 3px solid var(--line); box-sizing: border-box; }
.stepper .past .dot { background: var(--primary); border-color: var(--primary); }
.stepper .current .dot, .stepper [aria-checked="true"] .dot { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 0 5px var(--primary-soft); }
.stepper .expected:not(.current) .dot { border-style: dashed; border-color: var(--red); }
.step-note { display: flex; align-items: center; justify-content: flex-end; gap: 4px; font-size: 11px; color: var(--muted); margin: -8px 0 10px; }
.step-note i { width: 10px; height: 10px; border-radius: 50%; border: 2px dashed var(--red); }
.stepper .lbl { font-size: 12px; color: var(--muted); display: grid; justify-items: center; line-height: 1.3; }
.stepper .lbl small { font-size: 10px; }
.stepper .lbl em { font-style: normal; font-size: 10px; color: var(--muted); opacity: .8; font-variant-numeric: tabular-nums; }
.stepper .current .lbl { color: var(--primary); font-weight: 700; }
/* 今日の目標：ドリル画面と同じ青いカードで、白い文字にする */
.proposal { display: grid; gap: 4px; padding: 16px; border-radius: 14px; color: #fff; background: linear-gradient(135deg, #2563EB 0%, #3B82F6 100%); box-shadow: 0 6px 18px rgba(37, 99, 235, .22); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .proposal { background: linear-gradient(135deg, #172554 0%, #1D4ED8 100%); box-shadow: none; } }
.proposal .pr-k { color: rgba(255, 255, 255, .85); }
.pr-note { margin: -2px 0 6px; font-size: 11px; opacity: .75; }
.pr-alert { display: flex; align-items: flex-start; gap: 6px; margin-top: 6px; padding: 8px 10px; border-radius: 10px; background: rgba(255, 255, 255, .14); font-size: 12px; line-height: 1.5; }
.pr-alert::before { content: "!"; flex: 0 0 16px; height: 16px; border-radius: 50%; background: var(--accent); color: #1E293B; font-weight: 700; font-size: 11px; display: grid; place-items: center; margin-top: 1px; }
.pr-k { font-size: 13px; color: var(--muted); }
.pr-today { margin: 0 0 6px; font-size: 14px; line-height: 1.5; }
.pr-today b { font-size: 26px; margin: 0 2px; }
.pr-today span { opacity: .7; }
.th-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
.th-top b { color: var(--navy); }
.pr-main { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.pr-main b { font-size: 26px; line-height: 1.2; }
.pr-main span { font-size: 13px; opacity: .8; }
.pr-items { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
.pr-items li { display: grid; grid-template-columns: 5em auto 1fr; align-items: baseline; gap: 8px; font-size: 13px; }
.pr-items { border-top: 1px solid rgba(255, 255, 255, .2); padding-top: 8px !important; }
.pr-items li span { opacity: .85; }
.pr-items li small { opacity: .8; font-size: 11px; text-align: right; }
.pr-items li.future { opacity: .45; }

/* この時期のおすすめ（PR） */
.pr-badge { background: none; cursor: pointer; font-size: 11px; font-weight: 700; letter-spacing: .05em; padding: 1px 8px; border-radius: 4px; border: 1px solid var(--muted); color: var(--muted); }
.aff-list { list-style: none; margin: 0; padding: 0; }
.aff-list li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.aff-list li:first-child { border-top: 0; padding-top: 0; }
.aff-body { flex: 1; min-width: 0; display: grid; gap: 2px; }
.aff-kind { justify-self: start; font-size: 10px; font-weight: 700; color: var(--primary); background: var(--primary-soft); padding: 0 8px; border-radius: 999px; }
.aff-body b { font-size: 14px; color: var(--navy); }
.aff-note { font-size: 12px; color: var(--muted); line-height: 1.5; }
.aff-price { font-size: 11px; color: var(--muted); }
.aff-tag { display: inline-block; margin-left: 6px; padding: 0 8px; border-radius: 999px; background: var(--red); color: #fff; font-size: 11px; font-weight: 700; font-style: normal; vertical-align: 1px; white-space: nowrap; }
.aa-note .aff-tag { margin: 0 6px 0 0; }
.aff-merits { list-style: none; margin: 2px 0 0; padding: 0; font-size: 12px; line-height: 1.6; color: var(--text); }
.aff-list .aff-merits li { display: block; padding: 0; border: 0; }
.aff-merits li::before { content: "✓ "; color: var(--primary); font-weight: 700; }
.aff-lead { margin: -4px 0 12px; font-size: 13px; color: var(--muted); line-height: 1.6; }
.aff-card .aff-btn { background: var(--primary); color: #fff; }
.aff-btn { flex: 0 0 auto; min-height: 36px; padding: 0 12px; font-size: 13px; text-decoration: none; color: var(--primary); border-color: var(--primary); }
.aff-btn::after { content: " ›"; white-space: pre; }
.pr-notice { margin: -4px 0 12px; font-size: 11px; color: var(--muted); }
@media (max-width: 420px) { .aff-list li { flex-wrap: wrap; } .aff-list .aff-body { flex-basis: 100%; } }
.link-inline { background: none; border: 0; padding: 0; color: var(--primary); text-decoration: underline; font-size: inherit; }
.adv-link { display: inline; background: none; border: 0; padding: 0; margin-left: 4px; color: var(--primary); font-size: 12px; font-weight: 700; text-decoration: underline; }

/* 今日のタスク：明るいカードに、チェックできるタスクと達成バー */
.today-task { padding: 16px; border-radius: 14px; background: linear-gradient(135deg, #EAF2FF 0%, #F6F9FF 55%, var(--surface) 100%); border: 1px solid #C7DBFF; box-shadow: 0 4px 16px rgba(37, 99, 235, .10); }
.tt-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tt-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #3B82F6, #2563EB); border-radius: 999px; padding: 3px 10px; letter-spacing: .04em; }
.tt-count { font-size: 12px; color: var(--muted); }
.tt-count b { font-size: 16px; color: var(--primary); font-variant-numeric: tabular-nums; }
.tt-title { margin: 10px 0 8px; font-size: 15px; font-weight: 700; color: var(--navy); line-height: 1.5; }
.tt-title b { font-size: 20px; color: var(--primary); margin: 0 2px; }
.tt-bar { height: 6px; border-radius: 3px; background: #D6E4FF; overflow: hidden; }
.tt-bar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #60A5FA, #2563EB); transition: width .3s; }
.tt-list { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; }
.tt-item { position: relative; display: flex; align-items: center; gap: 10px; padding: 10px 12px; min-height: 44px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; line-height: 1.5; color: var(--text); cursor: pointer; transition: border-color .15s, background .15s; }
.tt-item:hover { border-color: #93C5FD; }
.tt-item input { position: absolute; opacity: 0; pointer-events: none; }
.tt-item:has(input:focus-visible) { outline: 2px solid var(--primary); outline-offset: 2px; }
.tt-check { flex: 0 0 22px; height: 22px; border-radius: 50%; border: 2px solid #93C5FD; display: grid; place-items: center; transition: background .15s, border-color .15s; }
.tt-item.done { background: var(--primary-soft); border-color: transparent; }
.tt-item.done .tt-check { background: var(--primary); border-color: var(--primary); }
.tt-item.done .tt-check::after { content: ""; width: 9px; height: 5px; margin-top: -2px; border: solid #fff; border-width: 0 0 2px 2px; transform: rotate(-45deg); }
.tt-item.done .tt-text { color: var(--muted); text-decoration: line-through; }
.tt-cheer { display: none; margin: 12px 0 0; text-align: center; font-size: 13px; font-weight: 700; color: var(--primary); }
.today-task.all-done .tt-cheer { display: block; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .today-task { background: linear-gradient(135deg, #172A4D 0%, var(--surface) 100%); border-color: #25406E; box-shadow: none; }
  :root:not([data-theme="light"]) .tt-bar { background: #1E3354; }
  :root:not([data-theme="light"]) .tt-item.done .tt-check::after { border-color: #0F172A; }
}

/* 復習 */
.rv-kpi { display: grid; margin-bottom: 8px; }
.rv-kpi span { font-size: 12px; opacity: .85; }
.rv-kpi b { font-size: 26px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.done-mark svg { width: 32px; height: 32px; color: var(--accent); }
.weak-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.weak-row { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.weak-row:hover { border-color: var(--primary); }
.cat-icon.sm { flex: 0 0 32px; height: 32px; border-radius: 8px; }
.cat-icon.sm svg { width: 18px; height: 18px; }
.weak-body { flex: 1; min-width: 0; display: grid; gap: 4px; }
.weak-name { font-size: 14px; font-weight: 500; color: var(--navy); line-height: 1.4; }
.weak-name small { display: block; font-size: 10px; color: var(--muted); font-weight: 400; }
.weak-n { font-size: 20px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
.weak-n small { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 1px; }
.done-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.done-row { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; color: var(--text); }
.done-row:not(:disabled):hover { border-color: var(--primary); }
.done-row:disabled { opacity: .6; }
.done-mark { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; display: grid; place-content: center; font-weight: 700; background: var(--card-quiet); color: var(--muted); }
.done-mark.ok { background: var(--primary-soft); color: var(--primary); }
.done-mark.ng { color: var(--red); }
.done-body { flex: 1; min-width: 0; font-size: 13px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.done-body small { display: block; font-size: 10px; color: var(--muted); }
.done-go { color: var(--muted); font-size: 18px; }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; gap: 2px; background: var(--card-quiet); }
.stack i { display: block; min-width: 0; }
.stack .weak, .stack-legend .weak { background: var(--red); }
.stack .strong, .stack-legend .strong { background: var(--primary); }
.stack-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.stack-legend span { display: inline-flex; align-items: center; gap: 4px; }
.stack-legend i { width: 10px; height: 10px; border-radius: 3px; }
.stack-legend b { color: var(--text); }

/* 会員は広告と会員紹介を出さない */
body.is-member .member-promo, body.is-member .gad-side { display: none; }
body.on-login aside .member-promo { display: none; }
/* 会員紹介（サイド）：合格の「サクラサク」にちなんで、ほんのり桜色 */
.member-promo {
  --sakura: #D6336C; --sakura-soft: #FFF0F5; --sakura-line: #F9D5E2;
  position: relative; overflow: hidden; border-radius: 14px; padding: 18px 16px 14px;
  background: linear-gradient(160deg, var(--sakura-soft) 0%, var(--surface) 70%); border: 1px solid var(--sakura-line);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .member-promo { --sakura: #F472B6; --sakura-soft: #33192A; --sakura-line: #4A2640; }
}
.member-promo::after { content: ""; position: absolute; right: -30px; top: -30px; width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(circle, rgba(236, 72, 153, .16), transparent 70%); }
