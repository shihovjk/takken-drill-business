.member-promo > * { position: relative; z-index: 1; }
.mp-eyebrow { font-size: 11px; font-weight: 700; color: var(--sakura); letter-spacing: .08em; }
.mp-title { margin: 4px 0 10px; font-size: 16px; font-weight: 700; color: var(--navy); line-height: 1.5; }
.mp-list { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; font-size: 13px; color: var(--text); }
.mp-list li { position: relative; padding-left: 20px; line-height: 1.5; }
.mp-list li::before { content: ""; position: absolute; left: 2px; top: 5px; width: 10px; height: 6px; border: solid var(--sakura); border-width: 0 0 2px 2px; transform: rotate(-45deg); }
.mp-price { margin: 0 0 10px; font-size: 12px; color: var(--muted); }
/* ボタンは桜色になじむ濃いめのローズ。白文字でも読みやすい濃さにする */
.mp-btn {
  min-height: 44px; font-size: 15px; font-weight: 700; color: #fff; border-color: transparent;
  background: linear-gradient(135deg, #E64C86 0%, #C8285F 100%); box-shadow: 0 4px 14px rgba(200, 40, 95, .28);
  transition: transform .15s, box-shadow .15s;
}
.mp-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(200, 40, 95, .36); }
.mp-btn:active { transform: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .mp-btn { background: linear-gradient(135deg, #F472B6 0%, #EC4899 100%); color: #2A0E1C; box-shadow: none; }
}
.mp-free { margin: 8px 0 0; font-size: 11px; color: var(--muted); text-align: center; }
/* ログイン画面の会員プランの案内（サイドの会員紹介と同じ桜色） */
.login-plan { margin-top: 16px; }
.lp-text { margin: 4px 0 12px; font-size: 14px; line-height: 1.7; color: var(--text); }
.lp-text b { color: var(--sakura); }

/* 広告掲載の募集（サイド） */
.sponsor-cta { border: 1px dashed var(--line); border-radius: 14px; padding: 14px 16px; background: var(--surface); }
.sponsor-wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px; }
@media (min-width: 900px) { .sponsor-wrap { display: none; } }
@media (max-width: 899px) { aside .sponsor-cta { display: none; } }
.sponsor-cta .label { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.sc-title { margin: 4px 0 8px; font-size: 15px; font-weight: 700; color: var(--navy); }
.sc-list { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.sc-list li { font-size: 12px; color: var(--muted); line-height: 1.5; }
.sc-list b { display: block; font-size: 13px; color: var(--text); font-weight: 500; }
.sc-btn { min-height: 38px; font-size: 13px; color: var(--navy); }

.member-badge.link { cursor: pointer; }
/* 会員向けの分析を、会員でない人には本人の数字だけぼかして見せる */
.lk { filter: blur(5px); user-select: none; }
.ml-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); }
.ml-icon { flex: 0 0 32px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--accent); }
.ml-icon svg { width: 17px; height: 17px; }
.ml-bar .ml-text { flex: 1 1 180px; font-size: 13px; font-weight: 700; color: var(--navy); line-height: 1.5; }
.ml-bar .btn { min-height: 38px; padding: 0 16px; font-size: 13px; }

/* 広告掲載のご案内 */
.adv-hero { border-radius: 16px; padding: 22px 20px; color: #fff; background: linear-gradient(135deg, #1E3A8A, #2563EB); margin-bottom: 16px; }
.adv-hero .eyebrow { font-size: 12px; opacity: .85; }
.adv-hero h1 { color: #fff; font-size: 22px; margin: 4px 0 8px; }
.adv-hero p { margin: 0; font-size: 14px; opacity: .92; }
.adv-points { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 16px; }
.adv-point { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.adv-point b { display: block; color: var(--navy); margin-bottom: 4px; }
.adv-point span { font-size: 13px; color: var(--muted); line-height: 1.6; }
.adv-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.adv-table th, .adv-table td { text-align: left; padding: 10px 6px; border-top: 1px solid var(--line); vertical-align: top; }
.adv-table th { width: 32%; color: var(--navy); font-weight: 500; }
.adv-table td { color: var(--muted); }
.price-table td b { display: block; font-size: 15px; color: var(--navy); margin-bottom: 2px; }
.form-grid { display: grid; gap: 12px; }
.form-grid label { display: grid; gap: 4px; font-size: 13px; color: var(--navy); }
.form-grid input, .form-grid select, .form-grid textarea { font: inherit; font-size: 15px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--text); }
.form-grid textarea { min-height: 100px; resize: vertical; }
.form-grid .req { color: var(--red); font-size: 11px; margin-left: 4px; }
.form-grid .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.form-error { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--red-soft); color: var(--red); font-size: 13px; line-height: 1.6; }

/* ログイン直後の選択（無料／会員） */

/* くわしい解説（全員に表示） */
.detail { margin: 6px 0 0; padding: 8px 12px; border-radius: 10px; background: var(--card-quiet); display: grid; gap: 2px; font-size: 13px; line-height: 1.6; }
.detail dt { font-size: 11px; font-weight: 700; color: var(--primary); }
.detail dd { margin: 0 0 4px; color: var(--text); }
.detail dd:last-child { margin-bottom: 0; }

/* この問題のポイント（要点と図表） */
.point { margin: 0 0 16px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; line-height: 1.7; }
.point h3 { margin: 0 0 6px; font-size: 13px; color: var(--primary); }
.point p { margin: 0 0 8px; }
.fig { margin: 12px 0 0; }
.fig figcaption { font-size: 12px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
.fig-note { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.fig-scroll { overflow-x: auto; }
.fig-table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.5; }
.fig-table th, .fig-table td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.fig-table thead th { background: var(--card-quiet); font-size: 12px; color: var(--navy); }
.fig-table tbody th { font-weight: 500; background: var(--card-quiet); min-width: 3em; }
.fig-table td { min-width: 4em; }
.fig-table .hl { background: var(--accent-soft); font-weight: 700; }
.fig-flow { display: flex; align-items: stretch; }
.fig-node { flex: 1 1 0; min-width: 0; display: grid; align-content: center; gap: 2px; text-align: center; padding: 8px 6px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card-quiet); font-size: 13px; line-height: 1.4; }
.fig-node b { color: var(--navy); }
.fig-node small { font-size: 11px; color: var(--muted); }
.fig-node.key { border-color: var(--primary); background: var(--primary-soft); }
.fig-node.ng { border-color: var(--red); background: var(--red-soft); }
.fig-link { flex: 0 0 auto; max-width: 72px; display: grid; align-content: center; justify-items: center; padding: 0 4px; font-size: 11px; color: var(--muted); text-align: center; line-height: 1.3; }
.fig-link i { font-style: normal; font-size: 18px; color: var(--primary); line-height: 1; }
/* スマホでは流れ図を縦に並べる（横だと箱が細くなり読みにくい） */
@media (max-width: 480px) {
  .fig-flow { flex-direction: column; }
  .fig-node { flex: none; padding: 8px 12px; }
  .fig-link { max-width: none; display: flex; justify-content: center; align-items: center; gap: 6px; padding: 4px 0; }
  .fig-link i { transform: rotate(90deg); order: -1; }
}

/* 会員プラン */
/* 画面下のお知らせ（ログインしました など）。スマホでは下のナビの上に出す */
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 50; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 12px; background: var(--navy); color: #fff; font-size: 13px; box-shadow: 0 6px 20px rgba(15, 23, 42, .25); animation: toast-in .2s ease-out; transition: opacity .4s; }
.toast.out { opacity: 0; }
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px); } }
@media (max-width: 767px) { .toast { bottom: calc(76px + env(safe-area-inset-bottom)); } }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast { background: #E5EAF3; color: #0F172A; } }
.plan-hero { text-align: center; padding: 8px 0 4px; }
.plan-hero h1 { margin-bottom: 4px; }
.plan-hero p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 16px; }
.plan-card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 6px; text-align: left; }
.plan-card[aria-checked="true"] { border: 2px solid var(--primary); padding: 17px; }
.plan-card .pc-name { font-size: 14px; font-weight: 700; color: var(--navy); }
.plan-card .pc-price { font-size: 28px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
.plan-card .pc-price small { font-size: 13px; color: var(--muted); font-weight: 400; }
.plan-card .pc-note { font-size: 12px; color: var(--muted); }
.plan-card .pc-tag { position: absolute; top: -10px; right: 14px; font-size: 11px; font-weight: 700; background: var(--accent); color: #1E293B; padding: 2px 10px; border-radius: 999px; }
.compare { width: 100%; border-collapse: collapse; font-size: 13px; }
.compare th, .compare td { padding: 10px 6px; border-top: 1px solid var(--line); text-align: left; }
.compare thead th { border-top: 0; font-size: 12px; color: var(--muted); font-weight: 500; }
.compare td.c { text-align: center; width: 64px; }
.compare .yes { color: var(--primary); font-weight: 700; }
.compare .no { color: var(--muted); }
.compare .yes.txt { font-size: 12px; white-space: nowrap; }

/* 本番形式の模試 */
.mock-entry { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: linear-gradient(135deg, var(--primary-soft) 0%, var(--surface) 100%); border: 1.5px solid var(--primary); border-radius: 12px; padding: 14px; margin-top: 20px; color: var(--text); box-shadow: 0 2px 10px rgba(37, 99, 235, .12); }
.mock-entry:hover { box-shadow: 0 4px 14px rgba(37, 99, 235, .2); }
.mock-entry .me-body b { color: var(--navy); }
.mock-entry .me-go { color: var(--primary); }
.own-mock-head { margin: 16px 0 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--muted); }
.mock-entry.own-mock { margin-top: 0; }
.own-first + .own-mock-head { margin-bottom: 12px; }
.own-mock .me-body b { font-size: 14px; }
.own-mock .me-body small { font-size: 12px; }
.own-mock-price { white-space: nowrap; font-style: normal; font-weight: 700; color: var(--red); font-size: 14px; }
.own-mock .me-go { flex: 0 0 auto; font-size: 13px; font-weight: 700; white-space: nowrap; }
@media (max-width: 420px) { .own-mock .me-go { font-size: 0; } .own-mock .me-go::after { content: "›"; font-size: 16px; } }
.me-icon { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; display: grid; place-content: center; background: var(--primary); color: #fff; }
.me-icon svg { width: 22px; height: 22px; }
.me-body { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.5; }
.me-body small { color: var(--muted); font-size: 12px; }
.me-go { color: var(--muted); font-size: 20px; }
.mock-hero { margin-bottom: 16px; }
.mock-hero h1 { font-size: 20px; margin: 2px 0 8px; }
.mock-hero p { color: var(--muted); font-size: 14px; margin: 0; }
.mh-eyebrow { font-size: 12px; font-weight: 700; color: var(--primary); }
.mock-list { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 8px; }
.mock-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.mr-body { flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; line-height: 1.5; }
.mr-meta { font-size: 12px; color: var(--muted); }
.mr-score { font-size: 22px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.mr-score.ok { color: var(--primary); }
.mr-score small { font-size: 12px; margin-left: 2px; }
.mr-btns { display: flex; gap: 8px; margin-left: auto; }
.mr-btns .btn svg { width: 15px; height: 15px; vertical-align: -2px; margin-right: 4px; }
.mock-row.locked .mr-body b { color: var(--muted); }
.mock-how { margin: 0; padding-left: 20px; font-size: 14px; display: grid; gap: 4px; }
.mock-time { font-size: 13px; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mock-time.warn { color: #B45309; }
.mock-time.over { color: var(--red); }
.mock-count { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tag.mq-no { background: var(--navy); color: var(--surface); font-weight: 700; }
.mock-nav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin-top: 16px; }
.mock-flag { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.mock-flag svg { width: 15px; height: 15px; }
.mock-flag.on { border-color: var(--accent); color: #B45309; background: var(--accent-soft); }
.mock-finish { margin-top: 12px; }
.mock-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.mock-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); vertical-align: -1px; margin-right: 4px; }
.mock-legend i.done { background: var(--primary); border-color: var(--primary); }
.mock-legend i.flag { border: 2px solid var(--accent); }
.mock-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.mock-grid button { aspect-ratio: 1; min-height: 32px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; font-variant-numeric: tabular-nums; padding: 0; }
.mock-grid button.done { background: var(--primary); border-color: var(--primary); color: #fff; }
.mock-grid button.flag { box-shadow: inset 0 0 0 2px var(--accent); }
.mock-grid button.cur { outline: 2px solid var(--navy); outline-offset: 1px; }
@media (max-width: 420px) { .mock-grid { grid-template-columns: repeat(7, 1fr); } }
.mock-score .ms-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.ms-num { margin: 0; color: var(--navy); }
.ms-num b { font-size: 44px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.ms-num small { font-size: 16px; color: var(--muted); margin-left: 4px; }
.ms-sub { font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
.ms-over { color: var(--red); }
.compare .mem { background: var(--primary-soft); }
.plan-cta { position: sticky; bottom: 0; margin: 16px -16px 0; padding: 12px 16px; display: grid; gap: 6px; text-align: center; background: var(--bg); border-top: 1px solid var(--line); }
@media (max-width: 767px) { .plan-cta { bottom: calc(64px + env(safe-area-inset-bottom)); } }
.plan-cta small { font-size: 12px; color: var(--muted); }
.member-on { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: var(--primary-soft); color: var(--primary); font-weight: 700; margin-bottom: 16px; }
.member-on svg { width: 20px; height: 20px; }
.member-on span { flex: 1; }
.member-on .link-inline { font-weight: 400; font-size: 13px; }

/* 会員機能：合格ペース診断・解答スピード */
.mini { font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.pace { width: 100%; border-collapse: collapse; font-size: 13px; }
.pace th, .pace td { padding: 8px 4px; border-top: 1px solid var(--line); text-align: left; font-weight: 400; }
.pace thead th { border-top: 0; font-size: 11px; color: var(--muted); padding-top: 0; }
.pace tbody th { font-weight: 500; color: var(--navy); white-space: nowrap; }
.pace .num { text-align: right; font-variant-numeric: tabular-nums; }
.pace .muted { color: var(--muted); }
.status { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 10px; border-radius: 999px; background: var(--card-quiet); color: var(--muted); }
.status.ok { background: var(--primary-soft); color: var(--primary); }
.status.warn { background: var(--accent-soft); color: #B45309; }
.status.ng { background: var(--red-soft); color: var(--red); }
.predict { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: var(--card-quiet); }
.predict div:first-child { display: grid; }
.predict .k { font-size: 12px; color: var(--muted); }
.predict b { font-size: 32px; color: var(--navy); line-height: 1.1; font-variant-numeric: tabular-nums; }
.predict b small { font-size: 13px; color: var(--muted); font-weight: 400; }
.predict-msg { font-size: 13px; font-weight: 700; color: var(--muted); }
.predict-msg.ok { color: var(--primary); }
.predict-msg.ng { color: var(--red); }
.speed .spd-cell, .mock-cats .spd-cell { width: 40%; }
.spd-bar { position: relative; display: block; height: 6px; background: var(--card-quiet); border-radius: 3px; }
.spd-bar i { display: block; height: 100%; border-radius: 3px; background: var(--primary); }
.spd-bar i.slow { background: var(--red); }
.spd-bar em { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--navy); }
.pace td.slow { color: var(--red); font-weight: 700; }

/* 成績 */
.stats-hero {
  color: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px;
  background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 70%, #3B82F6 100%);
  box-shadow: 0 8px 24px rgba(37, 99, 235, .25);
  display: grid; grid-template-columns: auto 1fr; gap: 12px 20px; align-items: center;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stats-hero { background: linear-gradient(135deg, #172554 0%, #1D4ED8 100%); box-shadow: none; } }
.stats-hero .ring-num b { font-size: 28px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpis div { display: grid; }
.kpis .k { font-size: 11px; opacity: .85; }
.kpis b { font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.kpis b small { font-size: 12px; font-weight: 400; margin-left: 2px; }
.stats-hero .ring-wrap { grid-row: span 2; }
.mini-badges { grid-column: 2; justify-self: start; display: flex; align-items: center; gap: 3px; flex-wrap: nowrap; background: none; border: 0; padding: 4px 6px; margin: -4px -6px; border-radius: 999px; color: #fff; cursor: pointer; }
.mini-badges:hover { background: rgba(255, 255, 255, .1); }
.mb-label { font-size: 11px; opacity: .85; margin-left: 4px; white-space: nowrap; }
.mb { flex: 0 0 18px; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .12); }
.mb svg { width: 12px; height: 12px; opacity: .45; }
.mb.got { background: var(--accent); }
.mb.got svg { opacity: 1; color: #fff; }
.sh-top { grid-column: 1 / -1; margin-bottom: 0; }
.sh-title { font-size: 13px; font-weight: 700; opacity: .9; }
/* 青いカードの中の学習カレンダー（白の濃さで量を表す） */
.sh-cal { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding-top: 4px; }
.stats-hero .heat { grid-template-columns: repeat(7, 12px); gap: 3px; }
.stats-hero .heat .dow { color: rgba(255, 255, 255, .75); font-size: 8px; }
.stats-hero .heat i { border-radius: 3px; background: rgba(255, 255, 255, .14) !important; }
.stats-hero .heat i.lv1 { background: rgba(255, 255, 255, .35) !important; }
.stats-hero .heat i.lv2 { background: rgba(255, 255, 255, .6) !important; }
.stats-hero .heat i.lv3 { background: rgba(255, 255, 255, .85) !important; }
.stats-hero .heat i.lv4 { background: var(--accent) !important; }
.stats-hero .heat i.future { background: transparent !important; border: 1px dashed rgba(255, 255, 255, .25); }
.stats-hero .heat i.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.sh-week { flex: 1; display: grid; gap: 6px; }
.sh-week div { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12px; border-bottom: 1px solid rgba(255, 255, 255, .15); padding-bottom: 4px; }
.sh-week div:last-child { border-bottom: 0; }
.sh-week span { opacity: .85; }
.sh-week b { font-size: 18px; font-variant-numeric: tabular-nums; }
.sh-week b small { font-size: 11px; font-weight: 400; margin-left: 1px; opacity: .85; }
/* 解答タイマーの説明に出すイメージ */
.timer-preview { display: grid; grid-template-columns: 1fr; gap: 8px; margin: 0 0 12px; padding: 10px; border-radius: 12px; background: var(--card-quiet); }
.tp-caption { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
.tp-screen { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 6px; }
.tp-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; white-space: nowrap; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.tp-right { display: inline-flex; align-items: center; gap: 8px; }
.tp-screen .q-timer { font-size: 11px; gap: 4px; padding: 0; cursor: default; }
.tp-screen .q-timer svg { width: 12px; height: 12px; }
.tp-screen .q-timer i { width: 30px; height: 4px; }
.tp-q { height: 5px; border-radius: 3px; background: var(--line); }
.tp-q.short { width: 60%; }
.tp-note { font-size: 11px; color: var(--muted); }

/* 下から出るシート（達成バッジの詳細など） */
.sheet { border: 0; padding: 16px 20px calc(20px + env(safe-area-inset-bottom)); width: min(480px, 100%); max-height: 80vh; border-radius: 16px; background: var(--surface); color: var(--text); }
@media (max-width: 767px) { .sheet { margin: auto 0 0; width: 100%; max-width: 100%; border-radius: 16px 16px 0 0; } }
.sheet::backdrop { background: rgba(15, 23, 42, .45); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sheet-head h2 { margin: 0; }
.sheet-close { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--card-quiet); font-size: 20px; line-height: 1; color: var(--muted); }
/* 成績のシェア */
.share-result { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; margin-top: 12px; border: 0; border-radius: 12px; background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 6px 16px rgba(37, 99, 235, .22); }
.share-result svg { width: 18px; height: 18px; color: var(--accent); }
.share-result:active { transform: translateY(1px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .share-result { box-shadow: none; } }
.sh-top { flex-wrap: wrap; row-gap: 6px; }
.sh-top .sh-title { white-space: nowrap; }
.sh-top-right { display: inline-flex; align-items: center; gap: 6px; margin-left: auto; }
button.share-pill { text-decoration: none; cursor: pointer; }
.share-apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 4px 0 14px; }
.share-apps button { display: grid; justify-items: center; gap: 6px; padding: 6px 0; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 500; cursor: pointer; }
.app-icon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; transition: transform .15s ease, box-shadow .15s ease; }
.app-icon svg { width: 28px; height: 28px; }
.app-x, .app-threads { background: #000; }
.app-instagram { background: radial-gradient(circle at 30% 107%, #FDF497 0%, #FDF497 5%, #FD5949 45%, #D6249F 60%, #285AEB 90%); }
.app-line { background: #06C755; }
.app-line svg { width: 32px; height: 32px; }
.share-apps button[aria-selected="true"] { color: var(--text); font-weight: 700; }
.share-apps button[aria-selected="true"] .app-icon { transform: translateY(-2px); box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--primary), 0 6px 14px rgba(15, 23, 42, .18); }
.share-apps button:not([aria-selected="true"]) .app-icon { opacity: .55; }
.share-apps button:hover .app-icon { opacity: 1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .app-x, :root:not([data-theme="light"]) .app-threads { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .18); } }
.share-themes { display: flex; gap: 8px; flex-wrap: wrap; }
.share-themes button { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text); font-size: 13px; cursor: pointer; }
.share-themes i { position: relative; width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(15, 23, 42, .12); }
.share-themes i b { position: absolute; right: 3px; bottom: 3px; width: 9px; height: 9px; border-radius: 50%; }
.share-themes button[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.share-preview { display: grid; place-items: center; border-radius: 12px; background: var(--card-quiet); padding: 8px; }
.share-preview img { display: block; max-width: 100%; max-height: 34vh; border-radius: 8px; }
.share-preview.tall img { max-height: 44vh; }
.share-label { font-size: 13px; font-weight: 700; color: var(--navy); margin: 14px 0 6px; display: flex; justify-content: space-between; }
.share-count { font-weight: 400; color: var(--muted); }
.share-count.over { color: var(--red); font-weight: 700; }
.share-items { display: flex; flex-wrap: wrap; gap: 6px; }
.share-items label { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; cursor: pointer; }
.share-items label:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.share-items label.off { opacity: .45; cursor: default; }
.share-items input { accent-color: var(--primary); margin: 0; }
.share-text { width: 100%; box-sizing: border-box; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); font: inherit; font-size: 14px; line-height: 1.6; resize: vertical; }
.share-note { margin: 6px 0 0; }
.share-note:empty { display: none; }
.share-actions { display: grid; gap: 8px; margin-top: 12px; }
.share-actions [hidden] { display: none; }
.share-sub { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.share-sub:has(> :only-child:not([hidden])) , .share-sub:has(> [hidden]) { grid-template-columns: 1fr; }
.badge-list { list-style: none; margin: 0; padding: 0; }
.badge-list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.badge-list li:first-child { border-top: 0; }
.bl-medal { flex: 0 0 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--card-quiet); color: var(--muted); }
.bl-medal svg { width: 20px; height: 20px; }
.badge-list li.got .bl-medal { background: var(--accent); color: #fff; }
.bl-body { flex: 1; display: grid; gap: 4px; min-width: 0; }
.bl-body b { font-size: 14px; color: var(--navy); }
.bl-bar { height: 5px; background: var(--card-quiet); border-radius: 3px; overflow: hidden; }
.bl-bar i { display: block; height: 100%; background: var(--primary); }
.badge-list li.got .bl-bar i { background: var(--accent); }
.bl-state { font-size: 12px; color: var(--muted); white-space: nowrap; }
.badge-list li.got .bl-state { color: #B45309; font-weight: 700; }
.week-msg { grid-column: 1 / -1; margin: 0; font-size: 13px; padding: 8px 12px; border-radius: 10px; background: rgba(255, 255, 255, .12); }
.h-sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; }

.heat { display: grid; grid-template-columns: repeat(7, 14px); gap: 4px; }
.heat .dow { font-size: 9px; color: var(--muted); text-align: center; line-height: 1.2; }
.heat i.future { background: transparent; border: 1px dashed var(--line); }
.heat i { display: block; aspect-ratio: 1; border-radius: 3px; background: var(--line); }
.heat i.today { outline: 2px solid var(--navy); outline-offset: 1px; }
.lv1 { background: #BFD4FE !important; }
.lv2 { background: #7FA8F8 !important; }
.lv3 { background: #3B74EE !important; }
.lv4 { background: #1E3A8A !important; }

.cat-stats { display: grid; gap: 14px; }
.cat-stat { display: flex; gap: 12px; align-items: flex-start; }
.cat-stat-body { flex: 1; min-width: 0; }
.cat-stat-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cat-stat-top b { color: var(--navy); }
.pts { margin-left: auto; font-size: 12px; color: var(--muted); }
.pill { font-size: 11px; padding: 0 8px; border-radius: 999px; background: var(--card-quiet); color: var(--muted); }
.pill.good { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.pill.weak { background: var(--accent-soft); color: #B45309; font-weight: 700; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.weak { color: var(--accent); } }
.acc-bar { position: relative; height: 10px; background: var(--line); border-radius: 5px; margin: 6px 0 4px; }
.acc-bar i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, #60A5FA, var(--primary)); }
.acc-bar .line { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--navy); border-radius: 1px; }
.cat-stat-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 0 8px; }
.cat-stat-meta .goal { margin-left: auto; }
.cat-stat-meta b { color: var(--text); }
.ans { font-weight: 700; margin-right: 4px; }
.ans.t { color: var(--primary); }
.ans.f { color: var(--red); }


.stat-row { display: grid; grid-template-columns: 7em 1fr 4.5em; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 14px; }
.bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--primary); }
.num-right { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; }

/* サイド（広告・会員紹介）：問題より目立たせない */
aside { display: grid; gap: 12px; align-content: start; }
/* スマホ：広告・会員紹介は本文から十分離し、ページの一番下に小さく置く */
@media (max-width: 899px) {
  aside { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); }
}
.quiet {
  background: var(--card-quiet); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  font-size: 13px; color: var(--muted); line-height: 1.7;
}
.quiet .label { font-size: 11px; letter-spacing: .08em; display: block; margin-bottom: 4px; }
.quiet strong { color: var(--text); font-weight: 500; }
/* AdSense（問題と会員紹介のあいだ）。広告が付かなかったときは枠ごと消す */
.gad-side { text-align: center; line-height: 1; min-height: 100px; }
.gad-side .label { display: block; margin-bottom: 4px; font-size: 10px; letter-spacing: .08em; color: var(--muted); }
.gad-side:has(ins[data-ad-status="unfilled"]) { display: none; }
#side-ad[hidden] { display: none; }
.ad-box .aff-list li { flex-wrap: wrap; gap: 8px; }
.ad-box .aff-body { flex-basis: 100%; }
.ad-box .aff-btn { flex: 1 1 auto; }
/* 宅建コラム（ページの下）：方眼ノートのような生成り色で、アプリの画面と見た目を分ける */
.columns { background: #FBF8F1; background-image: linear-gradient(#EFE7D6 1px, transparent 1px); background-size: 100% 28px; border-top: 1px solid #EFE7D6; }
.columns .inner { max-width: 1080px; margin: 0 auto; padding: 28px 16px 24px; }
.col-head h2 { margin: 2px 0 4px; font-family: "Klee One", "Noto Sans JP", sans-serif; font-size: 24px; color: #3B3325; }
.col-head p { margin: 0 0 14px; font-size: 13px; color: #6B5E45; }
.col-kicker { display: inline-block; padding: 1px 10px; border-radius: 999px; background: var(--accent); color: #1E293B; font-size: 11px; font-weight: 700; }
/* 種類が6つあるので、狭い画面では横にスクロールする */
.col-tabs { display: flex; gap: 4px; max-width: 760px; margin-bottom: 12px; overflow-x: auto; scrollbar-width: none; }
.col-tabs::-webkit-scrollbar { display: none; }
.col-tabs button { flex: 1 0 auto; white-space: nowrap; padding-inline: 14px !important; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 6px 4px; border-radius: 999px; border: 1px solid #EFE7D6; background: #fff; color: #6B5E45; font-size: 14px; font-weight: 700; line-height: 1.3; }
.col-tabs button small { font-size: 11px; font-weight: 400; }
.col-tabs button[aria-selected="true"] { background: #1E3A8A; border-color: #1E3A8A; color: #fff; }
.col-tabs button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.col-cards { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; }
@media (max-width: 767px) { .col-cards { grid-auto-columns: 72%; margin: 0 -16px; padding: 0 16px 6px; } }
.col-card { scroll-snap-align: start; display: flex; flex-direction: column; overflow: hidden; border-radius: 14px; background: #fff; border: 1px solid #EFE7D6; color: #1E293B; text-decoration: none; box-shadow: 0 2px 8px rgba(59, 51, 37, .06); transition: transform .15s ease, box-shadow .15s ease; }
.col-card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(59, 51, 37, .12); }
.col-card img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; }
.col-card span { display: grid; gap: 4px; padding: 10px 12px 14px; }
.col-card em { font-style: normal; font-size: 11px; color: #8A7B5C; }
.col-card em b { display: inline-block; margin-right: 6px; padding: 0 8px; border-radius: 999px; font-size: 10.5px; }
.col-card em b.info { background: #EAF1FF; color: #2563EB; }
.col-card em b.study { background: #FFF4DB; color: #B45309; }
.col-card em b.ronten { background: #E7F7EF; color: #047857; }
.col-card em b.after { background: #FDECF1; color: #BE185D; }
.col-card em b.kiso { background: #EEF0FF; color: #4338CA; }
.col-card em b.kyozai { background: #E6F7F5; color: #0F766E; }
.col-card strong { font-size: 14px; line-height: 1.5; color: #1E3A8A; }
.col-all { display: inline-block; margin-top: 12px; font-size: 14px; font-weight: 700; color: #B45309; text-decoration: none; }
.col-all:hover { text-decoration: underline; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .columns { background-color: #1B2233; background-image: linear-gradient(#2A3246 1px, transparent 1px); border-top-color: #2A3246; }
  :root:not([data-theme="light"]) .col-head h2 { color: #E5EAF3; } :root:not([data-theme="light"]) .col-head p { color: #94A3B8; }
  :root:not([data-theme="light"]) .col-card { border-color: #2A3246; }
  :root:not([data-theme="light"]) .col-tabs button { background: #131F38; border-color: #2A3246; color: #94A3B8; }
  :root:not([data-theme="light"]) .col-tabs button[aria-selected="true"] { background: #C7D7FE; border-color: #C7D7FE; color: #0B1426; }
  :root:not([data-theme="light"]) .col-all { color: #FBBF24; } }
footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
footer .inner { max-width: 1080px; margin: 0 auto; padding: 16px; display: grid; gap: 8px; }
/* サイトの一番下の小さなリンク */
.foot-links { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.foot-links a { padding: 4px 0; font-size: 12px; color: var(--muted); text-decoration: none; }
.foot-links a:hover { color: var(--primary); text-decoration: underline; }
.foot-note, .foot-copy { margin: 0; font-size: 11px; line-height: 1.6; overflow-wrap: anywhere; }
/* 利用規約などの本文 */
.legal { font-size: 14px; line-height: 1.8; }
.legal h2 { font-size: 15px; margin: 20px 0 4px; }
.legal h2:first-child { margin-top: 0; }
.legal ul, .legal ol { padding-left: 20px; margin: 4px 0; }
.legal-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.legal-table th, .legal-table td { text-align: left; vertical-align: top; padding: 10px 8px; border-bottom: 1px solid var(--line); }
.legal-table th { width: 30%; color: var(--navy); font-weight: 700; }
@media (max-width: 560px) { .legal-table th, .legal-table td { display: block; width: auto; } .legal-table th { padding-bottom: 0; border: 0; } }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { cursor: pointer; padding: 12px 0; font-weight: 700; color: var(--navy); list-style: none; display: flex; justify-content: space-between; gap: 8px; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "＋"; color: var(--muted); }
.faq details[open] summary::after { content: "－"; }
.faq details p { margin: 0 0 12px; color: var(--text); }
.install-done { padding: 10px 12px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); font-weight: 700; }
</style>
